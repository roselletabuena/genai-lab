version: "3.8"

services:
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/localstack-init.sh:/etc/localstack/init/ready.d/init.sh

  # Zero-Cost Autonomous Remediation Supervisor Daemon (GL-55 / GL-58)
  remediation-daemon:
    build:
      context: .
      dockerfile: sandbox-runner/Dockerfile
    profiles:
      - ingress
      - remediation
    ports:
      - "${DAEMON_PORT:-8080}:8080"
    environment:
      - DAEMON_PORT=8080
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-local-dev-webhook-secret}
      - BASE_REPO_PATH=/workspace
      - WORKTREE_BASE_DIR=/tmp/genai-lab-worktrees
      - AUDIT_DIR=/workspace/audit-logs
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-3}
      - QUEUE_CAPACITY=${QUEUE_CAPACITY:-50}
      - CONTAINER_IMAGE=${CONTAINER_IMAGE:-node:24-alpine}
      - TEST_COMMAND=${TEST_COMMAND:-npm test}
      - MOCK_LLM=${MOCK_LLM:-true}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - remediation_worktrees:/tmp/genai-lab-worktrees
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Zero-Cost Cloudflare Quick/Named Tunnel Ingress Sidecar (GL-58 AC1 & AC4)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - ingress
    command: tunnel --no-autoupdate --url http://remediation-daemon:8080
    depends_on:
      - remediation-daemon

volumes:
  localstack_data:
    driver: local
  remediation_worktrees:
    driver: local
