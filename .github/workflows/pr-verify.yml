name: PR Verify

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality Gate & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@genai-lab/contracts

      - name: Check code formatting
        run: npm run format:check

      - name: Run linters
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Verify knowledge graph
        run: npm run graph:verify

      - name: Run unit and integration tests
        run: npm test

      - name: Build applications and packages
        run: npm run build

