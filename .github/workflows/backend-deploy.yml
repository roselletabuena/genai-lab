name: Deploy Backend
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch: # Manual Trigger option

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --no-workspaces

      - name: Build TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Prepare Lambda package
        working-directory: ./backend
        run: |
          cp package.json dist/
          cp package-lock.json dist/
          cd dist && npm ci --omit=dev --no-workspaces

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: SAM Build
        working-directory: ./infra
        run: sam build --use-container

      - name: SAM Deploy
        working-directory: ./infra
        run: |
          sam deploy \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset \
            --parameter-overrides Environment="dev" AllowedOrigins="https://roselle.dev,http://localhost:3000" InternalApiKey="${{ secrets.INTERNAL_API_KEY }}"

      - name: Verify CORS Configuration
        run: |
          echo "Verifying Lambda Function URL CORS configuration..."
          aws lambda get-function-url-config \
            --function-name my-ai-stack-stream-dev \
            --query "Cors" \
            --output json

          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Verifying S3 Bucket CORS for my-ai-stack-dev-${ACCOUNT_ID}..."
          aws s3api get-bucket-cors \
            --bucket "my-ai-stack-dev-${ACCOUNT_ID}" \
            --output json || echo "S3 bucket CORS verification skipped (IAM user does not have s3:GetBucketCors permissions)"
