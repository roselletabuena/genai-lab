[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remediation-agent"
version = "0.1.0"
description = "Autonomous Code Remediation & Sandbox Agent: Tree-sitter AST diagnostic and patch synthesis loop"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "genai-lab engineering" }
]
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "pydantic>=2.7.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
remediation-agent = "remediation_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remediation_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers"
