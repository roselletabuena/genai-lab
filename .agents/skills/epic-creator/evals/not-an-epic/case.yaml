schema_version: "1.1"
name: not-an-epic
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The user asks for an epic for a one-word typo on the pricing page. That is a task, not
  an epic: it has no outcome to measure, nothing to slice, and finishes in minutes.

  The tempting failure is to comply literally and produce a full epic document with a
  problem statement, success metrics, scope sections and several child stories for a typo.

  The correct run says plainly that this is a task (or at most a small story), does not pad
  it into an epic, and offers something useful instead: a one-line ticket with acceptance
  criteria, or a question about whether a larger pricing-page outcome is what the user
  really wants.
